version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    # Major toolchain migrations are reviewed separately.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    # Major action migrations are reviewed separately.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
