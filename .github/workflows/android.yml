name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install reference compiler
        run: |
          apt_mirror=''
          for candidate in azure.archive.ubuntu.com archive.ubuntu.com mirrors.kernel.org; do
            if timeout 8 getent ahostsv4 "$candidate" >/dev/null &&
              curl --fail --location --silent --show-error --connect-timeout 5 --max-time 12 \
                "https://${candidate}/ubuntu/dists/noble/InRelease" --output /dev/null; then
              apt_mirror="$candidate"
              break
            fi
          done
          if [ -z "$apt_mirror" ]; then
            echo "No Ubuntu package mirror could be resolved. Retry the job after DNS recovery."
            exit 1
          fi
          echo "Using Ubuntu mirror: $apt_mirror"
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -E "s@https?://(azure\\.archive|archive|security)\\.ubuntu\\.com/ubuntu@https://${apt_mirror}/ubuntu@g" "$apt_source"
            fi
          done
          sudo timeout 150 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update --error-on=any
          sudo timeout 180 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --no-install-recommends -y gfortran g++ pkg-config qtbase5-dev libboost-dev cmake ninja-build
      - name: Check Hamlib catalog and software-only Dummy backend
        run: bash scripts/check_hamlib.sh
      - name: Check pinned desktop compatibility fixtures
        run: |
          python3 scripts/wsjtcb_codec.py --check
          python3 scripts/wsjtcb_channel.py --check
          cmake -S native -B .tooling/native-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .tooling/native-host --parallel 2
          .tooling/native-host/control_checks
          python3 scripts/check_native.py .tooling/native-host
          python3 scripts/wsjtcb_pcm.py .tooling/native-host
          python3 scripts/wsjtcb_recordings.py .tooling/native-host
          python3 scripts/ft8_benchmark.py .tooling/native-host
          python3 scripts/wsjtcb_context.py --check
          python3 scripts/wsjtcb_context.py --check --optimization O2
          python3 scripts/wsjtcb_reference.py --check
          python3 scripts/wsjtcb_packing.py --check
          python3 scripts/wsjtcb_packing.py --check --optimization O2
          python3 scripts/wsjtcb_qso.py --check
          python3 scripts/wsjtcb_qso.py --check --optimization O2
          python3 scripts/wsjtcb_admission.py --check
          python3 scripts/wsjtcb_admission.py --check --optimization O2
          python3 scripts/wsjtcb_acoustic.py --check
          python3 -m unittest discover -s scripts/tests -p 'test_wsjtcb_*.py'
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK Platform and Build Tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and debug APK
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 8CBdroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: 8CBdroid-engine-probe
          path: engineprobe/build/outputs/apk/debug/engineprobe-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: 8CBdroid-device-checks
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            core/build/reports/tests/
            protocol/wsjtcb/build/reports/tests/
            protocol/ntp/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
